{% extends 'base.html' %}{% block title %}Leave a review{% endblock %}{% block content %}<section class="form-page"><div class="eyebrow">HELP THE COMMUNITY GROW</div><h1>How was your <span class="gradient-text">session?</span></h1><p class="muted">{{ session.skill.title }} · with {{ session.teacher.name }}</p><form method="post" class="panel form-stack wide-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Rating<select name="rating" required><option value="">Choose a rating</option><option value="5">★★★★★ — Excellent</option><option value="4">★★★★ — Very good</option><option value="3">★★★ — Good</option><option value="2">★★ — Fair</option><option value="1">★ — Needs improvement</option></select></label><label>Your feedback<textarea name="comment" rows="4" maxlength="300" placeholder="What did you enjoy or learn?"></textarea></label><button class="btn">Submit review</button></form></section>{% endblock %}
