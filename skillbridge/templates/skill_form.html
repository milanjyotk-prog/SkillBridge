{% extends 'base.html' %}{% block title %}Share a skill{% endblock %}{% block content %}<section class="form-page"><a class="back-link" href="{{ url_for('skills') }}">← Back to marketplace</a><div class="eyebrow">PASS IT FORWARD</div><h1>Share what you <span class="gradient-text">know.</span></h1><p class="muted">Your experience could be exactly what someone needs next.</p><form method="post" class="panel form-stack wide-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Skill title<input name="title" required minlength="3" maxlength="100" placeholder="e.g. Python for Beginners"></label><div class="form-two"><label>Category<select name="category" required><option value="">Choose a category</option>{% for c in ['Programming','Design','Productivity','Communication','Creative','Business','Science','Other'] %}<option>{{ c }}</option>{% endfor %}</select></label><label>Experience level<select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label></div><label>What will learners get from this session?<textarea name="description" rows="5" required minlength="10" maxlength="600" placeholder="Describe what you can teach, what learners will practise, and what they should bring..."></textarea><small class="field-hint">10–600 characters</small></label><button class="btn">Publish skill <span>↗</span></button></form></section>{% endblock %}
